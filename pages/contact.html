<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #c9fffd;
            margin: 0;
            padding: 0;
        }
        main {
            padding: 50px 0;
        }
        form {
            background-color: #ffffff;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        form h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #000000;
            text-align: center;
        }
        form label {
            display: block; /* Membuat label berada di baris tersendiri di atas input */
            margin-bottom: 8px;
            font-weight: bold;
            color: #000000;
            font-size: 14px;
        }
        form input[type="text"],
        form input[type="email"],
        form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        form textarea {
            height: 120px;
            resize: none; /* Mengunci ukuran kotak pesan agar tidak bisa ditarik/diubah ukurannya oleh pengguna */
        }
        /* Efek khusus (:focus) saat pengguna mengklik atau mengetik di dalam kolom input/textarea */
        form input[type="text"]:focus,
        form input[type="email"]:focus,
        form textarea:focus {
            border-color: #007bff; /* Mengubah warna garis tepi menjadi biru */
            outline: none; /* Menghilangkan garis biru bawaan browser */
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.25); 
            background-color: #ffffff;
        }
        form button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;            
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        form button:hover {
            background-color: #0056b3;
        }
        footer {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <main>
        <!-- Atribut action="#" berarti data formulir dikirim ke halaman ini sendiri, method="POST" digunakan untuk mengirim data secara aman -->
        <form action="#" method="POST" class="contact-form">
            <h2>hubungi saya</h2>
            <div class="form-group">
                <label for="name">nama lengkap</label>
                <input type="text" id="name" name="name" placeholder="Masukkan nama lengkap Anda" required>
            </div>
            <div class="form-group">
                <label for="email">alamat email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email aktif Anda" required>
            </div>
            <div class="form-group">
                <label for="message">pesan anda</label>
                <textarea id="message" name="message" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">kirim pesan</button>
        </form>
    </main>
    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>

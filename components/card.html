<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        * {
            box-sizing: border-box; /* Biar box tidak melebihi 320px */
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #c9fffd;
            font-family: Arial, sans-serif;
        }
        main {
            padding: 40px 0;
        }
        .card {
            width: 320px; /* Mengatur lebar tetap untuk kotak kartu */
            padding: 20px;
            border: 2px solid #333333;
            margin: 30px auto; /* Memberikan jarak luar atas-bawah, dan auto kiri-kanan agar kartu di tengah */
            background-color: #f8fafa;
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Efek bayangan halus di sekeliling kartu */
        }
        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover; /* Memotong gambar secara proporsional agar pas dengan ukuran kotak tanpa menjadi gepeng */
            border-radius: 6px;
        }
        .card h3 {
            color: #222222;
            margin-top: 15px;
            margin-bottom: 8px;
            font-size: 20px;
        }
        .card p {
            font-size: 15px;
            color: #555555;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .card a {
            display: inline-block; /* Mengubah tautan menjadi kotak agar bisa diberi padding dan ukuran */
            text-decoration: none; /* Menghilangkan garis bawah bawaan pada tautan tombol */
            background-color: #007bff;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.3s ease; /* Memberikan efek animasi halus saat warna tombol berubah */
        }
        .card a:hover {
            background-color: #0056b3; /* Mengubah warna tombol menjadi lebih gelap saat disentuh kursor */
        }
        footer {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="../assets/images/carlson.jpg" alt="gambar proyek portofolio">
            <h3>Website Portofolio Pribadi</h3>
            <p>Proyek membuat website portofolio sederhana menggunakan HTML dan CSS </p>
            <a href="#">lihat proyek</a>
        </div>
    </main>
    <footer>
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>

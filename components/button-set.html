<!DOCTYPE HTML>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #c9fffd;
        h2 {
            font-size: 20px;
            color: navy;
        }
        }
        h2, .button-group {
            margin-top: 20px;
        }
        .btn {
            display: inline-block;
    /* biar sejajar */
            padding: 12px 24px;
/* biar nda nempel ama elemen lain */
            border-radius: 8px;
/* biar bulat */
            text-decoration: none;
/* biar nda ada garis jelek */
            font-weight: bold;
            transition: all 0.3s ease;
/* transisi berubah warna seberapa cepat */
        }
        .button-group .btn {
            margin-right: 10px;
/* jarak sebelah kanan */
            margin-bottom: 10px;
/* jarak bawah */
        }
        .btn-primary {
            background-color: navy;
/* warna backround  */
            color: #c9fffd;
        }
        .btn-secondary {
            background-color: rgb(244, 249, 233);
            color: navy
        }
        .btn-outline {
            background-color: #ffffff;
            border: 2px solid ;
            color: navy;
        }
        .btn-send {
            background-color: #fff000;
            color: navy;
        }
        .btn:hover {
    cursor: pointer;
        }
        .btn-primary:hover {
            background-color: deeppink;
        }
        .btn-secondary:hover {
            background-color: rgb(95, 187, 151);
        }
        .btn-outline:hover {
            background-color: rgba(255, 132, 23, 1);
        }
        .btn-send:hover {
            background-color: #ff0000;
        }
    </style>
</head>
<body>
    <main>
        <h2>tombol</h2>
        <div class="button-group">
            <a href="#" class="btn btn-primary">lihat proyek</a>
            <a href="#" class="btn btn-secondary">unduh cv</a>
            <a href="#" class="btn btn-outline">hubungi saya</a>
            <a href="#" class="btn btn-send">kirim pesan</a>
<!-- untuk membuat teks di dalam tombol -->
        </div>
    </main>
    <footer>
        <a href="../index.html">kembali ke beranda</a>
    </footer>
</body>
</html>
